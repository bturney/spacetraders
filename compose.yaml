services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spacetraders}
      POSTGRES_USER: ${POSTGRES_USER:-spacetraders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the host .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - spacetraders-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command:
      - bin/spacetraders
      - eval
       - "SpaceTraders.Release.migrate()"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-spacetraders}
      POSTGRES_USER: ${POSTGRES_USER:-spacetraders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in the host .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in the host .env}
      PHX_HOST: ${PHX_HOST:?set PHX_HOST in the host .env}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-spacetraders}
      POSTGRES_USER: ${POSTGRES_USER:-spacetraders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in the host .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in the host .env}
      PHX_HOST: ${PHX_HOST:?set PHX_HOST in the host .env}
      PHX_CHECK_ORIGINS: ${PHX_CHECK_ORIGINS:-}
      PORT: 4000
    ports:
      - "${WEB_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s

volumes:
  spacetraders-postgres:
