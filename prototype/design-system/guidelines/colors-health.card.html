<!-- @dsCard group="Colors" viewport="700x120" name="Plan health" subtitle="Four states; grey is hollow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}
.m{font-family:var(--font-mono)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:52px;border-radius:10px;border:1px solid var(--st-line)}.l{font-size:12px}.d{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}</style></head><body><div class="row" style="gap:22px"><div style="display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:50%;background:var(--health-on-plan);box-shadow:0 0 10px var(--health-on-plan)"></span><span style="font-weight:600;color:var(--health-on-plan)">On plan</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:50%;background:var(--health-setback);box-shadow:0 0 10px var(--health-setback)"></span><span style="font-weight:600;color:var(--health-setback)">Small setback</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:50%;background:var(--health-off-plan);box-shadow:0 0 10px var(--health-off-plan)"></span><span style="font-weight:600;color:var(--health-off-plan)">Off plan</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:50%;border:1.5px dashed var(--health-unknown)"></span><span style="font-weight:600;color:var(--health-unknown)">Can't tell</span></div></div>
<div class="d" style="margin-top:14px">card bg = colour 9% · border = colour 35% · transitions .6s</div></body></html>
