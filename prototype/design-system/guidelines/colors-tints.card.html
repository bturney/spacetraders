<!-- @dsCard group="Colors" viewport="700x120" name="Tints" subtitle="color-mix steps for chips, cards, fills" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}
.m{font-family:var(--font-mono)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:52px;border-radius:10px;border:1px solid var(--st-line)}.l{font-size:12px}.d{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:color-mix(in oklch,var(--st-green) 16%,transparent)"></div><div class="l">16%</div><div class="d">chip bg</div></div><div class="sw"><div class="chip" style="background:color-mix(in oklch,var(--st-green) 9%,transparent)"></div><div class="l">9%</div><div class="d">card bg</div></div><div class="sw"><div class="chip" style="background:color-mix(in oklch,var(--st-green) 35%,transparent)"></div><div class="l">35%</div><div class="d">card border</div></div><div class="sw"><div class="chip" style="background:color-mix(in oklch,var(--st-green) 55%,transparent)"></div><div class="l">55%</div><div class="d">bar fill</div></div></div></body></html>
