<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}
.m{font-family:var(--font-mono)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:52px;border-radius:10px;border:1px solid var(--st-line)}.l{font-size:12px}.d{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--st-page)"></div><div class="l">Page</div><div class="d">--st-page</div></div><div class="sw"><div class="chip" style="background:var(--st-bg)"></div><div class="l">App</div><div class="d">--st-bg</div></div><div class="sw"><div class="chip" style="background:var(--st-panel)"></div><div class="l">Card</div><div class="d">--st-panel</div></div><div class="sw"><div class="chip" style="background:var(--st-panel-2)"></div><div class="l">Inner</div><div class="d">--st-panel-2</div></div><div class="sw"><div class="chip" style="background:var(--st-line)"></div><div class="l">Line</div><div class="d">--st-line</div></div><div class="sw"><div class="chip" style="background:var(--st-track)"></div><div class="l">Track</div><div class="d">--st-track</div></div></div></body></html>
