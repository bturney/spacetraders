<!-- @dsCard group="Colors" viewport="700x150" name="Ship status" subtitle="One hue per status" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}
.m{font-family:var(--font-mono)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:52px;border-radius:10px;border:1px solid var(--st-line)}.l{font-size:12px}.d{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--status-trading)"></div><div class="l">Trading</div><div class="d">--status-trading</div></div><div class="sw"><div class="chip" style="background:var(--status-busy)"></div><div class="l">Busy, not earning</div><div class="d">--status-busy</div></div><div class="sw"><div class="chip" style="background:var(--status-waiting)"></div><div class="l">Waiting on purpose</div><div class="d">--status-waiting</div></div><div class="sw"><div class="chip" style="background:var(--status-stuck)"></div><div class="l">Stuck</div><div class="d">--status-stuck</div></div><div class="sw"><div class="chip" style="background:var(--status-scouting)"></div><div class="l">Scouting (probe)</div><div class="d">--status-scouting</div></div></div></body></html>
