<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}
.m{font-family:var(--font-mono)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}
.chip{height:52px;border-radius:10px;border:1px solid var(--st-line)}.l{font-size:12px}.d{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}</style></head><body><div class="row" style="background:var(--gf-bg);padding:12px;border-radius:6px"><div class="sw" style="width:72px"><div class="chip" style="background:var(--gf-panel);border-color:var(--gf-border);height:36px;border-radius:2px"></div><div class="d" style="color:var(--gf-text-dim)">--gf-panel</div></div><div class="sw" style="width:72px"><div class="chip" style="background:var(--gf-border);border-color:var(--gf-border);height:36px;border-radius:2px"></div><div class="d" style="color:var(--gf-text-dim)">--gf-border</div></div><div class="sw" style="width:72px"><div class="chip" style="background:var(--gf-text);border-color:var(--gf-border);height:36px;border-radius:2px"></div><div class="d" style="color:var(--gf-text-dim)">--gf-text</div></div><div class="sw" style="width:72px"><div class="chip" style="background:var(--gf-green);border-color:var(--gf-border);height:36px;border-radius:2px"></div><div class="d" style="color:var(--gf-text-dim)">--gf-green</div></div><div class="sw" style="width:72px"><div class="chip" style="background:var(--gf-orange);border-color:var(--gf-border);height:36px;border-radius:2px"></div><div class="d" style="color:var(--gf-text-dim)">--gf-orange</div></div><div class="sw" style="width:72px"><div class="chip" style="background:var(--gf-red);border-color:var(--gf-border);height:36px;border-radius:2px"></div><div class="d" style="color:var(--gf-text-dim)">--gf-red</div></div><div class="sw" style="width:72px"><div class="chip" style="background:var(--gf-blue);border-color:var(--gf-border);height:36px;border-radius:2px"></div><div class="d" style="color:var(--gf-text-dim)">--gf-blue</div></div></div></body></html>
