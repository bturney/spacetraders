name: Deploy

on:
  workflow_run:
    workflows: [Publish image]
    types: [completed]

concurrency:
  group: production-deploy
  queue: max

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, project-host]
    steps:
      - name: Deploy published image
        run: /srv/projects/spacetraders/deploy deploy ghcr.io/bturney/spacetraders:sha-${{ github.event.workflow_run.head_sha }}
