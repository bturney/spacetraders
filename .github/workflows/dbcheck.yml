name: dbcheck

on:
  workflow_dispatch:

jobs:
  dbcheck:
    runs-on: [self-hosted, project-host]
    steps:
      - name: Find spacetraders containers and volumes
        run: |
          docker ps --format '{{.Names}}  {{.Image}}' || true
          docker volume ls --format '{{.Name}}' || true
      - name: Dump agents from prod DB
        run: |
          cat > /tmp/probe.exs <<'EOF'
          alias SpaceTraders.Repo
          import Ecto.Query
          rows = Repo.all(from(a in SpaceTraders.Agent.Agent, select: %{
            id: a.id, symbol: a.symbol, operator_id: a.operator_id,
            stale_at: a.stale_at, has_token: not is_nil(a.agent_token)
          }))
          IO.inspect(rows, label: "AGENTS")
          IO.inspect(Repo.aggregate(SpaceTraders.Agent.Agent, :count, :id), label: "AGENT_COUNT")
          EOF
          WEB=$(docker ps --format '{{.Names}}' | grep -i spacetrader | grep -i web | head -1)
          echo "WEB=$WEB"
          if [ -n "$WEB" ]; then
            docker cp /tmp/probe.exs "$WEB:/tmp/probe.exs"
            docker exec "$WEB" bin/spacetraders eval 'Code.eval_file("/tmp/probe.exs")'
          else
            VOL=$(docker volume ls --format '{{.Name}}' | grep -i spacetrader | head -1)
            echo "VOL=$VOL"
            docker run --rm -v "$VOL":/data alpine:3.21 sh -c 'apk add --no-cache sqlite3 >/dev/null 2>&1; sqlite3 /data/spacetraders.db "SELECT id, symbol, operator_id, stale_at FROM agents;"'
          fi