name: Verify

on:
  pull_request:
  push:
    branches: [impl/607-615]

permissions:
  contents: read

jobs:
  product-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: spacetraders_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d spacetraders_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/spacetraders_test
      MIX_DEPS_PATH: ${{ github.workspace }}/deps
      MISE_ERLANG_PRECOMPILED_OS: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@v5.1.1
        with:
          cache: true
      - name: Cache deps and _build
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.run_id }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}-
      - name: Prepare product verification prerequisites
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate
      - name: Run product verification
        run: scripts/verify

  release-deployment-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: spacetraders_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d spacetraders_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/spacetraders_test
      MIX_DEPS_PATH: ${{ github.workspace }}/deps
      MISE_ERLANG_PRECOMPILED_OS: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@v5.1.1
        with:
          cache: true
      - name: Cache deps and _build
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.run_id }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}-
      - name: Prepare release and migration verification prerequisites
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate
      - name: Verify PostgreSQL deployment configuration
        run: test/integration/postgres_compose_test.sh
      - name: Verify production release boot
        run: test/integration/release_boot_test.sh
      - name: Verify migration repair
        run: test/integration/migration_repair_test.sh
