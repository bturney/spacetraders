# Shared dev/test Postgres for every checkout (main and worktrees).
# Each checkout gets its own database; see config/checkout_db.exs.
# Start once: docker compose -f compose.dev.yaml up -d
name: spacetraders-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - spacetraders-dev-postgres:/var/lib/postgresql/data

volumes:
  spacetraders-dev-postgres:
